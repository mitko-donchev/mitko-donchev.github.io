<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/android-chrome-192.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0E14" />

    <!-- Fonts and the hero logo are requested from here, not from <Helmet>.

         They used to live in App.js, which meant React had to mount before
         the browser learned they existed: the font stylesheet request began
         121ms after main.js finished parsing, roughly two seconds into the
         load, and the preconnect hints landed in the same instant as the
         stylesheet they exist to warm up — so they warmed nothing. Every one
         of these is now discoverable in the first packet of HTML, in
         parallel with the bundle rather than behind it.

         The font list is exactly what the rendered page resolves to: walking
         every element with text in it turns up seven faces, against the
         thirteen that used to be requested. Dropped weight 300 (used
         nowhere), 700, and italic at 300 and 500. If you add a weight to the
         CSS, add it here too or the browser will synthesise it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- The LCP element. Kept in public/ rather than imported through the
         bundle so it has a stable path to preload — an imported asset gets a
         content hash that this file cannot know. The query string must match
         the <img> in Hero.jsx exactly or the browser fetches it twice. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/logo-full.png?v=3" fetchpriority="high" />

    <!-- These live here, not only in <Helmet>, because no social scraper runs
         our JavaScript. Facebook, Discord, Slack, iMessage and X all read the
         static document, so anything they need has to be in it. Keep this in
         sync with SITE_DESCRIPTION in src/config/links.js — and keep it inside
         the COPY RULE: a share card is the most-read copy on the site. -->
    <meta
      name="description"
      content="Waybound is an action-RPG roguelike built around one road out of a village — woods, narrows and a skeleton camp — with fast bow combat, a leap that buys you room, and runs that reshape every time you fall. Made in Godot by indie studio Epic Millennium. Wishlist on Steam."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Epic Millennium" />
    <meta property="og:title" content="Epic Millennium — Waybound" />
    <meta
      property="og:description"
      content="An action-RPG roguelike about one road out of a village. Fast bow combat, a leap that buys you room, and a run that is never quite the one you walked last time."
    />
    <meta property="og:url" content="https://www.epicmillennium.com" />
    <meta property="og:image" content="https://www.epicmillennium.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Waybound — a road leading out of a village gate at dusk." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@EpicMillennium" />
    <meta name="twitter:title" content="Epic Millennium — Waybound" />
    <meta
      name="twitter:description"
      content="An action-RPG roguelike about one road out of a village. Fast bow combat, a leap that buys you room, and a run that is never quite the one you walked last time."
    />
    <meta name="twitter:image" content="https://www.epicmillennium.com/og-image.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=3" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Epic Millennium — Waybound</title>
    <style>
      /* Inline on purpose: a stylesheet request would put this behind exactly
         the round trip it exists to fill. */
      #firstlight {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 80% at 50% 118%, rgba(232, 163, 61, 0.20) 0%, rgba(185, 116, 31, 0.06) 34%, transparent 62%),
          radial-gradient(80% 55% at 88% 14%, rgba(76, 92, 148, 0.14), transparent 60%),
          linear-gradient(180deg, #0A0D16 0%, #0B0E14 46%, #0C1017 100%);
        opacity: 1;
        transition: opacity 620ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #firstlight.is-gone { opacity: 0; }
      .fl-mark {
        font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
        font-size: 1.05rem;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #9C9689;
      }
      .fl-rule {
        width: 84px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(232, 163, 61, 0.55), transparent);
      }
      @media (prefers-reduced-motion: reduce) {
        #firstlight { transition: none; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <!-- Only parsed when scripting is off, which is exactly when the card
           below has nothing coming to replace it. -->
      <style>#firstlight { display: none !important; }</style>
      You need to enable JavaScript to run this app.
    </noscript>

    <!--
      First light.

      #root ships empty, so until the bundle has downloaded and run there is
      nothing to paint and first contentful paint lands after the load event —
      about 2.4s of blank on a cold visit. This is a title card in the game's
      own dark, discoverable in the first packet of HTML, with real text in it
      so it actually counts as contentful.

      It is a card, not a fake hero. Trying to match the real lockup's
      position would put a 150px jump between the two; a card that dissolves
      cannot be in the wrong place because it is never in the same place
      twice. Landing.jsx removes it after React has committed — see
      src/lib/firstLight.js.
    -->
    <div id="firstlight" aria-hidden="true">
      <div class="fl-mark">Epic Millennium</div>
      <div class="fl-rule"></div>
    </div>

    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
